<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050914"><title>算域突擊｜Math Strike Arena</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#050914;color:#edfaff;font-family:system-ui,sans-serif}main{text-align:center}b{color:#59e6ff}small{display:block;margin-top:12px;color:#84a2b7}</style></head><body><main><b>算域突擊載入中…</b><small>Math Strike Arena v1.0.1</small></main><script>(async()=>{try{const f=['payload-0.txt','payload-1.txt','payload-2.txt','payload-3.txt','payload-4.txt','payload-5.txt'],s=(await Promise.all(f.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.text()})))).join(''),b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream'in self))throw Error('請使用最新版 Chrome、Edge、Firefox 或 Safari');const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<main><b>遊戲載入失敗</b><small>'+String(e.message||e)+'</small></main>'}})();</script></body></html>
